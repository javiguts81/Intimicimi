<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Conexión Íntima</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Íntima">
    
    <!-- Manifest en línea para instalación móvil -->
    <link rel="manifest" href='data:application/json,{"name":"Conexión Íntima","short_name":"Íntima","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://fav.farm/🔥","sizes":"192x192","type":"image/png"}]}'>

    <!-- Cliente SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --primary: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(to right, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 12px;
        }

        .user-tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        .user-tab.active {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-main);
        }

        .partner-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
        }

        .partner-card h2 {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .status-badge.red { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-badge.yellow { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-badge.green { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }

        .partner-details {
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .traffic-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-main);
        }

        .traffic-btn .dot { width: 14px; height: 14px; border-radius: 50%; }
        .traffic-btn.red .dot { background: var(--accent-red); }
        .traffic-btn.yellow .dot { background: var(--accent-yellow); }
        .traffic-btn.green .dot { background: var(--accent-green); }

        .traffic-btn.selected.red { border-color: var(--accent-red); background: rgba(239, 68, 68, 0.1); }
        .traffic-btn.selected.yellow { border-color: var(--accent-yellow); background: rgba(245, 158, 11, 0.1); }
        .traffic-btn.selected.green { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.1); }

        .choice-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 6px;
            color: var(--text-main);
            font-size: 0.78rem;
            cursor: pointer;
            text-align: center;
        }

        .choice-btn.selected { background: var(--primary); border-color: var(--primary); font-weight: 600; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .sub-panel { display: flex; flex-direction: column; gap: 14px; }
        .sub-panel.disabled { opacity: 0.25; pointer-events: none; }

        .save-btn {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white; border: none; border-radius: 14px;
            padding: 14px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header><h1>Conexión Íntima</h1></header>

    <div class="user-switch">
        <button class="user-tab active" onclick="switchUser('me')">Mi Estado</button>
        <button class="user-tab" onclick="switchUser('partner')">Vista Pareja</button>
    </div>

    <div class="partner-card">
        <h2 id="partner-title">Estado de tu pareja</h2>
        <div id="partner-status-display" class="status-badge yellow">
            <span id="partner-status-text">Cargando...</span>
        </div>
        <div class="partner-details" id="partner-details-display">
            <div><strong>¿Cuándo?:</strong> <span id="partner-when">-</span></div>
            <div><strong>¿Qué apetece?:</strong> <span id="partner-what">-</span></div>
        </div>
    </div>

    <div>
        <div class="section-title">1. Tu disponibilidad</div>
        <div class="options-grid">
            <button class="traffic-btn red" onclick="setStatus('red')"><span class="dot"></span><span>Rojo</span></button>
            <button class="traffic-btn yellow selected" onclick="setStatus('yellow')"><span class="dot"></span><span>Amarillo</span></button>
            <button class="traffic-btn green" onclick="setStatus('green')"><span class="dot"></span><span>Verde</span></button>
        </div>
    </div>

    <div id="extra-options" class="sub-panel">
        <div>
            <div class="section-title">2. ¿Cuándo?</div>
            <div class="options-grid">
                <button class="choice-btn" onclick="selectChoice('when', 'Ahora mismo', this)">⚡ Ahora</button>
                <button class="choice-btn selected" onclick="selectChoice('when', 'En un rato', this)">⏳ En un rato</button>
                <button class="choice-btn" onclick="selectChoice('when', 'Esta noche', this)">🌙 Esta noche</button>
            </div>
        </div>

        <div>
            <div class="section-title">3. ¿Qué te apetece?</div>
            <div class="grid-2">
                <button class="choice-btn selected" onclick="selectChoice('what', 'Besos y caricias', this)">💆 Mimos & Besos</button>
                <button class="choice-btn" onclick="selectChoice('what', 'Sexo oral / Juegos', this)">💋 Sexo Oral</button>
                <button class="choice-btn" onclick="selectChoice('what', 'Hacer el amor', this)">🔥 Hacer el amor</button>
                <button class="choice-btn" onclick="selectChoice('what', 'Lo que surja', this)">🎲 Lo que surja</button>
            </div>
        </div>
    </div>

    <button class="save-btn" onclick="saveState()">Actualizar Mi Estado</button>
</div>

<script>
  // 1. Inicializar Supabase (mantén tus claves actuales)
  const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
  const SUPABASE_KEY = 'TU-ANON-KEY';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 2. DETECTAR QUIÉN ABRE LA APP DESDE LA URL (?user=me O ?user=partner)
  const urlParams = new URLSearchParams(window.location.search);
  const miUsuario = urlParams.get('user') || 'me'; // Por defecto será 'me'
  const usuarioPareja = (miUsuario === 'me') ? 'partner' : 'me';

  // 3. FUNCIÓN PARA CARGAR LOS ESTADOS EN LA PANTALLA
  async function cargarEstados() {
    // Cargar MI estado
    const { data: miEstado } = await supabase
      .from('estados')
      .select('*')
      .eq('id', miUsuario)
      .single();

    // Cargar el ESTADO DE MI PAREJA
    const { data: estadoPareja } = await supabase
      .from('estados')
      .select('*')
      .eq('id', usuarioPareja)
      .single();

    if (estadoPareja) {
      // Actualizar el texto que se ve en la sección "ESTADO DE TU PAREJA"
      document.getElementById('estado-pareja-ganas').innerText = estadoPareja.status || 'Sin datos';
      document.getElementById('estado-pareja-cuando').innerText = estadoPareja.when || 'Sin datos';
      document.getElementById('estado-pareja-apetece').innerText = estadoPareja.what || 'Sin datos';
    }
  }

  // 4. FUNCIÓN PARA GUARDAR AL PULSAR EL BOTÓN "Actualizar Mi Estado"
  async function actualizarMiEstado() {
    // Lee los valores que hayas seleccionado en los botones del formulario
    const statusSeleccionado = obtenerGanasSeleccionadas(); // adapta según tus funciones o variables
    const cuandoSeleccionado = obtenerCuandoSeleccionado();
    const apeteceSeleccionado = obtenerApeteceSeleccionado();

    const { data, error } = await supabase
      .from('estados')
      .upsert({
        id: miUsuario, // Guarda exactamente en la fila 'me' o 'partner'
        status: statusSeleccionado,
        when: cuandoSeleccionado,
        what: apeteceSeleccionado
      }, { onConflict: 'id' });

    if (error) {
      alert("Error al guardar: " + error.message);
    } else {
      alert("¡Estado actualizado!");
      cargarEstados(); // Recargar datos de la pantalla
    }
  }

  // Cargar datos automáticamente al abrir la página
  window.onload = cargarEstados;
</script>

</body>
</html>
