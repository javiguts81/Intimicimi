<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Conexión Íntima</title>
    
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Íntima">
    
    <link rel="manifest" href="./manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --primary: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(to right, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .partner-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
        }

        .partner-card h2 {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .status-badge.red { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-badge.yellow { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-badge.green { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }

        .partner-details {
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .traffic-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-main);
        }

        .traffic-btn .dot { width: 14px; height: 14px; border-radius: 50%; }
        .traffic-btn.red .dot { background: var(--accent-red); }
        .traffic-btn.yellow .dot { background: var(--accent-yellow); }
        .traffic-btn.green .dot { background: var(--accent-green); }

        .traffic-btn.selected.red { border-color: var(--accent-red); background: rgba(239, 68, 68, 0.1); }
        .traffic-btn.selected.yellow { border-color: var(--accent-yellow); background: rgba(245, 158, 11, 0.1); }
        .traffic-btn.selected.green { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.1); }

        .choice-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 6px;
            color: var(--text-main);
            font-size: 0.78rem;
            cursor: pointer;
            text-align: center;
        }

        .choice-btn.selected { background: var(--primary); border-color: var(--primary); font-weight: 600; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .sub-panel { display: flex; flex-direction: column; gap: 14px; }
        .sub-panel.disabled { opacity: 0.25; pointer-events: none; }

        .save-btn {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white; border: none; border-radius: 14px;
            padding: 14px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header><h1>Conexión Íntima</h1></header>

    <div class="partner-card">
        <h2 id="partner-title">ESTADO DE TU PAREJA</h2>
        <div id="partner-status-display" class="status-badge yellow">
            <span id="partner-status-text">Cargando...</span>
        </div>
        <div class="partner-details">
            <div><strong>¿Cuándo?:</strong> <span id="partner-when">-</span></div>
            <div><strong>¿Qué apetece?:</strong> <span id="partner-what">-</span></div>
        </div>
    </div>

    <div>
        <div class="section-title">1. Tu disponibilidad</div>
        <div class="options-grid">
            <button class="traffic-btn red" onclick="setStatus('red', this)"><span class="dot"></span><span>Rojo</span></button>
            <button class="traffic-btn yellow selected" onclick="setStatus('yellow', this)"><span class="dot"></span><span>Amarillo</span></button>
            <button class="traffic-btn green" onclick="setStatus('green', this)"><span class="dot"></span><span>Verde</span></button>
        </div>
    </div>

    <div id="extra-options" class="sub-panel">
        <div>
            <div class="section-title">2. ¿Cuándo?</div>
            <div class="options-grid" id="when-options">
                <button class="choice-btn" onclick="selectChoice('when', 'Ahora mismo', this)">⚡ Ahora</button>
                <button class="choice-btn selected" onclick="selectChoice('when', 'En un rato', this)">⏳ En un rato</button>
                <button class="choice-btn" onclick="selectChoice('when', 'Esta noche', this)">🌙 Esta noche</button>
            </div>
        </div>

        <div>
            <div class="section-title">3. ¿Qué te apetece?</div>
            <div class="grid-2" id="what-options">
                <button class="choice-btn selected" onclick="selectChoice('what', 'Besos y caricias', this)">💆 Mimos & Besos</button>
                <button class="choice-btn" onclick="selectChoice('what', 'Sexo oral / Juegos', this)">💋 Sexo Oral</button>
                <button class="choice-btn" onclick="selectChoice('what', 'Hacer el amor', this)">🔥 Hacer el amor</button>
                <button class="choice-btn" onclick="selectChoice('what', 'Lo que surja', this)">🎲 Lo que surja</button>
            </div>
        </div>
    </div>

    <button id="btn-save" class="save-btn" onclick="saveState()">Actualizar Mi Estado</button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./OneSignalSDKWorker.js');
  }

  const SUPABASE_URL = 'https://rtrrmgedadzlwhzyhxws.supabase.co/';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0cnJtZ2VkYWR6bHdoenloeHdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MzM3MDIsImV4cCI6MjEwNTMwOTcwMn0.eBY7sESf2RTHtg3rxCZEWmX8BVEOk-rPhzs_Ed5eDAo';
  
  const ONESIGNAL_APP_ID = 'e3dee093-28ed-432c-9c6a-ea0e784ea905';
  const ONESIGNAL_REST_KEY = 'os_v2_app_4ppobezi5vbszhdk5ihhqtvjau23zqgqxdrejnubyzexjfvcvvndmfa6bhcfsunkwoytahetqc5elft663avoztuwavq5ildxi4kgoi';
  const ONESIGNAL_SAFARI_ID = 'web.onesignal.auto.06522562-c4bd-4797-b0b8-e15944eb45af';

  let _supabase = null;

  const urlParams = new URLSearchParams(window.location.search);
  const miUsuario = urlParams.get('user') || 'me';
  const usuarioPareja = (miUsuario === 'me') ? 'partner' : 'me';

  let selectedStatus = 'yellow';
  let selectedWhen = 'En un rato';
  let selectedWhat = 'Besos y caricias';

  // Inicializar OneSignal sin bloquear la ejecución
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(function(OneSignal) {
    OneSignal.init({
      appId: ONESIGNAL_APP_ID,
      safari_web_id: ONESIGNAL_SAFARI_ID,
      notifyButton: { enable: false }
    }).then(() => {
      OneSignal.login(miUsuario);
    }).catch(err => console.log('OneSignal init error:', err));
  });

  function setStatus(color, el) {
    selectedStatus = color;
    document.querySelectorAll('.traffic-btn').forEach(btn => btn.classList.remove('selected'));
    if (el) el.classList.add('selected');

    const extraPanel = document.getElementById('extra-options');
    if (color === 'red') {
      extraPanel.classList.add('disabled');
    } else {
      extraPanel.classList.remove('disabled');
    }
  }

  function selectChoice(type, value, el) {
    if (type === 'when') {
      selectedWhen = value;
      document.querySelectorAll('#when-options .choice-btn').forEach(b => b.classList.remove('selected'));
    } else if (type === 'what') {
      selectedWhat = value;
      document.querySelectorAll('#what-options .choice-btn').forEach(b => b.classList.remove('selected'));
    }
    if (el) el.classList.add('selected');
  }

  window.addEventListener('DOMContentLoaded', () => {
    if (window.supabase) {
      _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      cargarEstadoInicial();

      _supabase
        .channel('realtime-partner-status')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'estados', filter: `id=eq.${usuarioPareja}` },
          (payload) => {
            if (payload.new) {
              actualizarInterfazPareja(payload.new);
            }
          }
        )
        .subscribe();
    }
  });

  async function cargarEstadoInicial() {
    if (!_supabase) return;
    try {
      const { data: pareja } = await _supabase
        .from('estados')
        .select('*')
        .eq('id', usuarioPareja)
        .maybeSingle();

      if (pareja) actualizarInterfazPareja(pareja);
    } catch (err) {
      console.error("Error leyendo Supabase:", err);
    }
  }

  function actualizarInterfazPareja(pareja) {
    const statusBadge = document.getElementById('partner-status-display');
    const statusText = document.getElementById('partner-status-text');
    const whenText = document.getElementById('partner-when');
    const whatText = document.getElementById('partner-what');

    if (pareja) {
      statusBadge.className = `status-badge ${pareja.status || 'yellow'}`;
      let label = 'Sin indicar';
      if (pareja.status === 'red') label = '🔴 No disponible';
      else if (pareja.status === 'yellow') label = '🟡 Con ganas...';
      else if (pareja.status === 'green') label = '🟢 ¡Con muchas ganas!';

      statusText.innerText = label;
      whenText.innerText = pareja.when || '-';
      whatText.innerText = pareja.what || '-';
    }
  }

  // Guardar estado
  async function saveState() {
    const btn = document.getElementById('btn-save');
    btn.innerText = "Guardando...";
    btn.disabled = true;

    // 1. Solicitar permisos de notificación si está OneSignal listo
    try {
      if (window.OneSignal) {
        await window.OneSignal.Notifications.requestPermission();
        await window.OneSignal.login(miUsuario);
      }
    } catch(e) {
      console.log('Error permisos OneSignal:', e);
    }

    // 2. Guardar en Supabase
    if (_supabase) {
      try {
        const { error } = await _supabase
          .from('estados')
          .upsert({
            id: miUsuario,
            status: selectedStatus,
            when: (selectedStatus === 'red') ? '-' : selectedWhen,
            what: (selectedStatus === 'red') ? '-' : selectedWhat
          }, { onConflict: 'id' });

        if (error) {
          alert("Error Supabase: " + error.message);
        } else {
          alert("¡Estado actualizado con éxito!");
        }
      } catch(e) {
        alert("Error de conexión: " + e.message);
      }
    } else {
      alert("Error: Supabase no ha cargado correctamente.");
    }

    // 3. Enviar notificación Push en segundo plano
    try {
      let emoji = selectedStatus === 'green' ? '🟢' : (selectedStatus === 'yellow' ? '🟡' : '🔴');
      let title = `${emoji} ¡Nuevo estado de tu pareja!`;
      let message = selectedStatus === 'red' 
        ? 'Ha marcado estado Rojo (No disponible)' 
        : `${selectedWhen} | ${selectedWhat}`;

      fetch('https://onesignal.com/api/v1/notifications', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json; charset=utf-8',
          'Authorization': `Key ${ONESIGNAL_REST_KEY}`
        },
        body: JSON.stringify({
          app_id: ONESIGNAL_APP_ID,
          target_channel: 'push',
          include_aliases: {
            external_id: [usuarioPareja]
          },
          headings: { es: title, en: title },
          contents: { es: message, en: message }
        })
      });
    } catch(e) {
      console.log('Error enviando notificación:', e);
    }

    btn.innerText = "Actualizar Mi Estado";
    btn.disabled = false;
  }
</script>

</body>
</html>
